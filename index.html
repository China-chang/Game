<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6eee5">
  <title>甜心相册 · 消消乐</title>
  <style>
    :root {
      --ink: #352b3b;
      --muted: #766c7d;
      --cream: #fffaf4;
      --panel: rgba(255, 255, 255, 0.82);
      --pink: #ef5b78;
      --pink-dark: #c6385a;
      --gold: #f0a51b;
      --blue: #258bd2;
      --green: #56a77a;
      --shadow: 0 18px 50px rgba(75, 48, 72, 0.15);
      --board-size: min(88vw, 600px, calc(100dvh - 260px));
      --gap: clamp(3px, 0.7vw, 6px);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.92) 0 7%, transparent 26%),
        radial-gradient(circle at 92% 88%, rgba(255, 222, 180, 0.72), transparent 29%),
        linear-gradient(135deg, #f7eee5, #fbe6e9 48%, #e6f4ec);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 260px;
      height: 260px;
      border-radius: 52% 48% 60% 40%;
      filter: blur(2px);
      opacity: 0.46;
    }

    body::before {
      top: -110px;
      right: -70px;
      background: #f7b7c3;
      transform: rotate(22deg);
    }

    body::after {
      bottom: -130px;
      left: -80px;
      background: #b7dbc7;
      transform: rotate(-18deg);
    }

    button { font: inherit; }

    .app {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: clamp(14px, 2.5vw, 28px);
      display: grid;
      grid-template-columns: minmax(290px, 360px) minmax(320px, 620px);
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 4vw, 50px);
      min-height: 100dvh;
    }

    .sidebar {
      align-self: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--pink-dark);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "STKaiti", serif;
      font-size: clamp(38px, 5vw, 64px);
      line-height: 0.98;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
    }

    .stat {
      min-width: 0;
      padding: 13px 10px;
      border: 1px solid rgba(86, 66, 92, 0.09);
      border-radius: 18px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 8px 24px rgba(75, 48, 72, 0.08);
      text-align: center;
    }

    .stat span {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .stat strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: clamp(18px, 3vw, 26px);
      font-variant-numeric: tabular-nums;
    }

    .progress-card {
      padding: 15px 17px;
      border: 1px solid rgba(86, 66, 92, 0.09);
      border-radius: 20px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 8px 24px rgba(75, 48, 72, 0.08);
    }

    .progress-copy {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: 800;
    }

    .progress-track {
      height: 11px;
      overflow: hidden;
      border-radius: 99px;
      background: #eadfe4;
      box-shadow: inset 0 1px 3px rgba(60, 39, 59, 0.14);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--pink), #f6a14d);
      box-shadow: 0 0 15px rgba(239, 91, 120, 0.42);
      transition: width 350ms ease;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .legend-item {
      flex: 1 1 108px;
      min-width: 108px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px;
      border-radius: 13px;
      background: rgba(255,255,255,0.6);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .legend-item[hidden] { display: none; }

    .legend-dot {
      flex: 0 0 auto;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border: 3px solid;
      border-radius: 6px;
      color: #fff;
      font-size: 8px;
      line-height: 1;
    }

    .legend-item:nth-child(1) .legend-dot { border-color: var(--pink); background: var(--pink); }
    .legend-item:nth-child(2) .legend-dot { border-color: var(--gold); background: var(--gold); }
    .legend-item:nth-child(3) .legend-dot { border-color: var(--blue); background: var(--blue); }
    .legend-item:nth-child(4) .legend-dot { border-color: #7c4dcc; background: #7c4dcc; }
    .legend-item:nth-child(5) .legend-dot { border-color: #24a66a; background: #24a66a; }
    .legend-item:nth-child(6) .legend-dot { border-color: #e56f2d; background: #e56f2d; }
    .legend-item:nth-child(7) .legend-dot { border-color: #d345a5; background: #d345a5; }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      min-height: 45px;
      padding: 0 18px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 800;
      transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 3px solid rgba(37, 139, 210, 0.45); outline-offset: 3px; }

    .btn-primary {
      flex: 1;
      color: white;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      box-shadow: 0 10px 22px rgba(198, 56, 90, 0.25);
    }

    .btn-secondary {
      color: var(--ink);
      background: rgba(255,255,255,0.78);
      box-shadow: 0 8px 20px rgba(75, 48, 72, 0.09);
    }

    .tip {
      min-height: 21px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    .game-area {
      position: relative;
      width: fit-content;
      justify-self: center;
    }

    .board-shell {
      position: relative;
      padding: clamp(9px, 1.5vw, 15px);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: clamp(24px, 4vw, 34px);
      background: rgba(255,255,255,0.78);
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(92, 61, 89, 0.06);
    }

    .board {
      width: var(--board-size);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: var(--gap);
      padding: var(--gap);
      overflow: hidden;
      border-radius: clamp(16px, 3vw, 24px);
      background: rgba(74, 58, 80, 0.13);
      box-shadow: inset 0 2px 10px rgba(53, 43, 59, 0.18);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      contain: layout style paint;
    }

    .board:focus-visible {
      outline: 4px solid rgba(37, 139, 210, 0.4);
      outline-offset: 5px;
    }

    .tile {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 0;
      overflow: hidden;
      border: clamp(3px, 0.55vw, 5px) solid var(--tile-color);
      border-radius: clamp(8px, 1.6vw, 15px);
      cursor: grab;
      background-color: var(--tile-fallback);
      background-image: var(--tile-image);
      background-position: center;
      background-size: cover;
      box-shadow: 0 2px 4px rgba(41, 29, 43, 0.12);
      transform: translateZ(0);
      /* Only transition transform + opacity — both are GPU-composited and cheap on mobile. */
      transition: transform 160ms ease, opacity 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(160deg, rgba(255,255,255,0.18), transparent 50%);
    }

    .tile::after {
      content: var(--tile-mark);
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: clamp(14px, 2.4vw, 21px);
      height: clamp(14px, 2.4vw, 21px);
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: var(--tile-color);
      font-size: clamp(8px, 1.3vw, 12px);
      font-weight: 900;
    }

    .tile.type-3 {
      --tile-color: #7c4dcc;
      --tile-fallback: #cdb9f0;
      --tile-mark: "◆";
      --tile-image: url("./image/cat-sofa.jpg");
      background-position: 50% 55%;
    }

    .tile.type-4 {
      --tile-color: #24a66a;
      --tile-fallback: #b5e0c9;
      --tile-mark: "▲";
      --tile-image: url("./image/cat-floor.jpg");
      background-position: 50% 55%;
    }

    .tile.type-5 {
      --tile-color: #e56f2d;
      --tile-fallback: #f2c4a3;
      --tile-mark: "✦";
      --tile-image: url("./image/selfie.jpg");
      background-position: 50% 25%;
    }

    .tile.type-6 {
      --tile-color: #d345a5;
      --tile-fallback: #efb7dc;
      --tile-mark: "✿";
      --tile-image: url("./image/couple.jpg");
      background-position: 50% 50%;
    }

    .tile:hover { transform: scale(1.03); }
    .tile:active { cursor: grabbing; }

    .tile.selected {
      z-index: 3;
      transform: scale(1.08);
      /* outline composites on its own layer — far cheaper than multi-layer box-shadow. */
      outline: 3px solid #fff;
      outline-offset: -6px;
    }

    .tile.drag-target {
      z-index: 2;
      transform: scale(0.92);
      outline: 3px solid rgba(255,255,255,0.9);
      outline-offset: -6px;
    }

    .tile.keyboard-focus {
      outline: 3px solid #fff;
      outline-offset: -7px;
    }

    .tile.hint {
      z-index: 4;
      outline: 4px solid #ffd24a;
      outline-offset: -4px;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.92), 0 0 22px rgba(240,165,27,0.9);
      animation: hintPulse 1.1s ease-in-out infinite;
    }

    .tile.removing { animation: popOut 240ms ease forwards; }
    .tile.new-tile { animation: dropIn 280ms cubic-bezier(.22,.9,.38,1.15); }
    .board.invalid { animation: boardShake 220ms ease; }
    .board.celebrate { animation: boardCelebrate 550ms ease; }

    .combo {
      position: absolute;
      z-index: 10;
      top: 45%;
      left: 50%;
      pointer-events: none;
      opacity: 0;
      color: #fff;
      font-family: Georgia, serif;
      font-size: clamp(28px, 6vw, 52px);
      font-weight: 900;
      text-shadow: 0 4px 0 var(--pink-dark), 0 8px 20px rgba(64, 34, 57, 0.36);
      transform: translate(-50%, -50%) scale(0.5) rotate(-7deg);
    }

    .combo.show { animation: comboPop 700ms ease; }

    .toast {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom));
      max-width: calc(100vw - 32px);
      padding: 11px 18px;
      border-radius: 99px;
      color: white;
      background: rgba(53,43,59,0.88);
      box-shadow: 0 10px 28px rgba(42,30,44,0.22);
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 18px);
      transition: opacity 200ms ease, transform 200ms ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .modal-backdrop {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(45, 32, 48, 0.44);
      backdrop-filter: blur(9px);
      opacity: 1;
      transition: opacity 200ms ease;
    }

    .modal-backdrop[hidden] { display: none; }

    .modal {
      width: min(420px, 100%);
      padding: clamp(25px, 5vw, 38px);
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 30px;
      background: #fffaf6;
      box-shadow: 0 30px 90px rgba(50, 31, 49, 0.3);
      text-align: center;
      animation: modalIn 300ms cubic-bezier(.17,.85,.33,1.15);
    }

    .modal-icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 13px;
      border-radius: 24px;
      color: white;
      background: linear-gradient(135deg, var(--pink), #f3a443);
      box-shadow: 0 12px 25px rgba(220, 78, 93, 0.26);
      font-size: 34px;
      transform: rotate(-6deg);
    }

    .modal h2 {
      margin: 0;
      font-family: Georgia, "STKaiti", serif;
      font-size: 34px;
    }

    .modal p {
      margin: 10px 0 22px;
      color: var(--muted);
      line-height: 1.7;
    }

    .modal-score {
      margin-bottom: 22px;
      padding: 13px;
      border-radius: 17px;
      background: #f3e9e7;
      font-size: 14px;
      font-weight: 800;
    }

    .modal-actions { display: flex; gap: 10px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes hintPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    @keyframes popOut {
      35% { transform: scale(1.15) rotate(4deg); opacity: 0.9; }
      100% { transform: scale(0.08) rotate(-15deg); opacity: 0; }
    }

    @keyframes dropIn {
      from { transform: translateY(-85%) scale(0.75); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes comboPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5) rotate(-7deg); }
      24% { opacity: 1; transform: translate(-50%, -50%) scale(1.15) rotate(3deg); }
      72% { opacity: 1; transform: translate(-50%, -60%) scale(1) rotate(-2deg); }
      100% { opacity: 0; transform: translate(-50%, -90%) scale(0.8) rotate(0); }
    }

    @keyframes boardShake {
      20% { transform: translateX(-7px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(3px); }
    }

    @keyframes boardCelebrate {
      25% { transform: scale(1.02) rotate(0.4deg); }
      50% { transform: scale(0.99) rotate(-0.4deg); }
      75% { transform: scale(1.01); }
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(25px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 820px) {
      :root {
        --board-size: min(
          calc(
            100vw - max(6px, env(safe-area-inset-left)) -
            max(6px, env(safe-area-inset-right)) - 14px
          ),
          560px
        );
      }

      .app {
        min-height: auto;
        grid-template-columns: 1fr;
        gap: 14px;
        padding-top: 20px;
        padding-right: max(6px, env(safe-area-inset-right));
        padding-bottom: 24px;
        padding-left: max(6px, env(safe-area-inset-left));
      }

      .sidebar {
        width: min(
          calc(
            100vw - max(6px, env(safe-area-inset-left)) -
            max(6px, env(safe-area-inset-right))
          ),
          560px
        );
        justify-self: center;
        gap: 11px;
      }

      .brand { text-align: center; }
      h1 { font-size: clamp(34px, 10vw, 52px); }
      .subtitle { display: none; }
      .legend { display: none; }
      .progress-card { padding: 11px 14px; }
      .actions { order: 5; }
      .tip { order: 4; }
      .game-area { grid-row: 2; max-width: 100%; }
      .board-shell { padding: 6px; }
    }

    @media (max-width: 430px) {
      :root { --gap: 3px; }
      .app { padding-top: 8px; padding-bottom: 12px; }
      .board-shell { border-radius: 20px; }
      .board { border-radius: 14px; }
      .tile { border-width: 3px; border-radius: 8px; }
      .tile::after { right: 2px; bottom: 2px; }
      .stat { padding: 9px 6px; border-radius: 14px; }
      .progress-copy { margin-bottom: 6px; }
      .btn { min-height: 42px; padding: 0 13px; }
    }

    @media (max-height: 730px) and (min-width: 821px) {
      :root { --board-size: min(56vw, 520px, calc(100dvh - 70px)); }
      .app { padding-top: 12px; padding-bottom: 12px; }
      .subtitle, .legend { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="sidebar" aria-label="游戏信息">
      <div class="brand">
        <p class="eyebrow">PHOTO MATCH</p>
        <h1>甜心相册<br>消消乐</h1>
        <p class="subtitle">拖动相邻照片交换位置，连成三个或更多相同图案。用有限的步数完成目标分数吧！</p>
      </div>

      <div class="stats" aria-label="当前状态">
        <div class="stat"><span>关卡</span><strong id="levelValue">1</strong></div>
        <div class="stat"><span>分数</span><strong id="scoreValue">0</strong></div>
        <div class="stat"><span>剩余步数</span><strong id="movesValue">16</strong></div>
      </div>

      <div class="progress-card">
        <div class="progress-copy">
          <span>通关进度</span>
          <span id="targetText">0 / 4400</span>
        </div>
        <div id="progressTrack" class="progress-track" role="progressbar" aria-label="通关进度" aria-valuemin="0" aria-valuemax="4400" aria-valuenow="0">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>

      <div class="legend" aria-label="图案边框说明">
        <div class="legend-item" data-type="0"><span class="legend-dot">♥</span><span>玫红</span></div>
        <div class="legend-item" data-type="1"><span class="legend-dot">★</span><span>金黄</span></div>
        <div class="legend-item" data-type="2"><span class="legend-dot">●</span><span>天蓝</span></div>
        <div class="legend-item" data-type="3"><span class="legend-dot">◆</span><span>沙发猫</span></div>
        <div class="legend-item" data-type="4" hidden><span class="legend-dot">▲</span><span>地板猫</span></div>
        <div class="legend-item" data-type="5" hidden><span class="legend-dot">✦</span><span>自拍</span></div>
        <div class="legend-item" data-type="6" hidden><span class="legend-dot">✿</span><span>合照</span></div>
      </div>

      <div class="actions">
        <button id="restartButton" class="btn btn-primary" type="button">重新开始本关</button>
        <button id="newGameButton" class="btn btn-secondary" type="button">回到第一关</button>
      </div>

      <p id="statusText" class="tip">拖动照片，或依次点击两个相邻图案进行交换</p>
    </section>

    <section class="game-area" aria-label="消消乐棋盘区">
      <div class="board-shell">
        <div id="board" class="board" role="grid" tabindex="0" aria-label="8乘8消消乐棋盘" aria-rowcount="8" aria-colcount="8"></div>
        <div id="combo" class="combo" aria-hidden="true">连击 ×2</div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <div id="liveRegion" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalMessage">
      <div id="modalIcon" class="modal-icon" aria-hidden="true">★</div>
      <h2 id="modalTitle">闯关成功！</h2>
      <p id="modalMessage">太棒了，你完成了本关目标。</p>
      <div id="modalScore" class="modal-score">最终得分：0</div>
      <div class="modal-actions">
        <button id="modalSecondary" class="btn btn-secondary" type="button">重玩本关</button>
        <button id="modalPrimary" class="btn btn-primary" type="button">下一关</button>
      </div>
    </section>
  </div>

  <script>
    "use strict";

    const ROWS = 8;
    const COLS = 8;
    const TILE_TYPES = 7;
    const IDLE_HINT_MS = 5000;
    const ANIMATION = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 10 : 180;
    const LEVELS = [
      { target: 4400, moves: 16 },
      { target: 2600, moves: 16 },
      { target: 1750, moves: 15 },
      { target: 1450, moves: 15 },
      { target: 1500, moves: 14 }
    ];

    const boardElement = document.getElementById("board");
    const levelValue = document.getElementById("levelValue");
    const scoreValue = document.getElementById("scoreValue");
    const movesValue = document.getElementById("movesValue");
    const targetText = document.getElementById("targetText");
    const progressTrack = document.getElementById("progressTrack");
    const progressFill = document.getElementById("progressFill");
    const statusText = document.getElementById("statusText");
    const restartButton = document.getElementById("restartButton");
    const newGameButton = document.getElementById("newGameButton");
    const comboElement = document.getElementById("combo");
    const toastElement = document.getElementById("toast");
    const liveRegion = document.getElementById("liveRegion");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalIcon = document.getElementById("modalIcon");
    const modalTitle = document.getElementById("modalTitle");
    const modalMessage = document.getElementById("modalMessage");
    const modalScore = document.getElementById("modalScore");
    const modalPrimary = document.getElementById("modalPrimary");
    const modalSecondary = document.getElementById("modalSecondary");
    const legendItems = [...document.querySelectorAll(".legend-item[data-type]")];

    const state = {
      board: [],
      level: loadLevel(),
      score: 0,
      moves: 0,
      target: 0,
      locked: false,
      selected: null,
      keyboard: { row: 0, col: 0 },
      drag: null,
      hint: null,
      hintTimer: null,
      runId: 0,
      newTiles: new Set(),
      toastTimer: null,
      modalMode: null
    };

    function loadLevel() {
      try {
        const stored = Number.parseInt(localStorage.getItem("photo-match-level"), 10);
        return Number.isFinite(stored) && stored > 0 ? stored : 1;
      } catch (_) {
        return 1;
      }
    }

    function saveLevel() {
      try {
        localStorage.setItem("photo-match-level", String(state.level));
      } catch (_) {
        // 本地存储不可用时不影响游玩。
      }
    }

    function getLevelConfig(level) {
      if (level <= LEVELS.length) return LEVELS[level - 1];
      const extraLevels = level - LEVELS.length;
      const finalLevel = LEVELS[LEVELS.length - 1];
      return {
        target: Math.min(1800, finalLevel.target + extraLevels * 50),
        moves: Math.max(13, finalLevel.moves - Math.floor((extraLevels + 2) / 3))
      };
    }

    function typeCountForLevel(level) {
      if (level <= 1) return 4;
      if (level === 2) return 5;
      if (level === 3) return 6;
      return TILE_TYPES;
    }

    function availableTypes(level = state.level) {
      return Array.from({ length: typeCountForLevel(level) }, (_, type) => type);
    }

    function wait(ms) {
      return new Promise(resolve => window.setTimeout(resolve, ms));
    }

    function randomType(level = state.level) {
      const types = availableTypes(level);
      return types[Math.floor(Math.random() * types.length)];
    }

    function keyOf(row, col) {
      return `${row},${col}`;
    }

    function parseKey(key) {
      const [row, col] = key.split(",").map(Number);
      return { row, col };
    }

    function inBounds(row, col) {
      return row >= 0 && row < ROWS && col >= 0 && col < COLS;
    }

    function areAdjacent(a, b) {
      return Math.abs(a.row - b.row) + Math.abs(a.col - b.col) === 1;
    }

    function swapCells(a, b, board = state.board) {
      const temp = board[a.row][a.col];
      board[a.row][a.col] = board[b.row][b.col];
      board[b.row][b.col] = temp;
    }

    function buildFallbackBoard(level = state.level) {
      const types = availableTypes(level);
      const board = Array.from(
        { length: ROWS },
        (_, row) => Array.from(
          { length: COLS },
          (_, col) => types[(row + col) % types.length]
        )
      );

      board[0][2] = types[0];
      board[1][1] = types[0];
      return board;
    }

    function createStableBoard(level = state.level) {
      const maxAttempts = 1000;
      const types = availableTypes(level);

      for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
        const board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        for (let row = 0; row < ROWS; row += 1) {
          for (let col = 0; col < COLS; col += 1) {
            const blocked = new Set();
            if (col >= 2 && board[row][col - 1] === board[row][col - 2]) {
              blocked.add(board[row][col - 1]);
            }
            if (row >= 2 && board[row - 1][col] === board[row - 2][col]) {
              blocked.add(board[row - 1][col]);
            }
            const choices = types.filter(type => !blocked.has(type));
            board[row][col] = choices[Math.floor(Math.random() * choices.length)];
          }
        }

        if (findMatches(board).size === 0 && hasValidMove(board)) {
          state.board = board;
          return;
        }
      }

      state.board = buildFallbackBoard(level);
    }

    function findMatches(board = state.board) {
      const matches = new Set();

      for (let row = 0; row < ROWS; row += 1) {
        let start = 0;
        for (let col = 1; col <= COLS; col += 1) {
          if (col < COLS && board[row][col] !== null && board[row][col] === board[row][start]) continue;
          if (board[row][start] !== null && col - start >= 3) {
            for (let current = start; current < col; current += 1) matches.add(keyOf(row, current));
          }
          start = col;
        }
      }

      for (let col = 0; col < COLS; col += 1) {
        let start = 0;
        for (let row = 1; row <= ROWS; row += 1) {
          if (row < ROWS && board[row][col] !== null && board[row][col] === board[start][col]) continue;
          if (board[start][col] !== null && row - start >= 3) {
            for (let current = start; current < row; current += 1) matches.add(keyOf(current, col));
          }
          start = row;
        }
      }

      return matches;
    }

    function findValidMove(board = state.board) {
      for (let row = 0; row < ROWS; row += 1) {
        for (let col = 0; col < COLS; col += 1) {
          const current = { row, col };
          const neighbors = [{ row, col: col + 1 }, { row: row + 1, col }];
          for (const neighbor of neighbors) {
            if (!inBounds(neighbor.row, neighbor.col)) continue;
            swapCells(current, neighbor, board);
            const valid = findMatches(board).size > 0;
            swapCells(current, neighbor, board);
            if (valid) {
              return {
                a: { ...current },
                b: { ...neighbor }
              };
            }
          }
        }
      }
      return null;
    }

    function hasValidMove(board = state.board) {
      return findValidMove(board) !== null;
    }

    function tileLabel(type) {
      return [
        "玫红爱心照片",
        "金黄星星照片",
        "天蓝圆点照片",
        "紫色沙发猫照片",
        "绿色地板猫照片",
        "橙色自拍照片",
        "粉色合照照片"
      ][type];
    }

    function render(options = {}) {
      const removing = options.removing || new Set();
      const currentSelected = state.selected;
      const kbRow = state.keyboard.row;
      const kbCol = state.keyboard.col;

      // Reuse existing tile nodes when the board is already populated; only
      // rebuild from scratch on first render or after a full reshuffle.
      let rebuild = boardElement.childElementCount !== ROWS * COLS;

      if (rebuild) {
        const fragment = document.createDocumentFragment();
        for (let row = 0; row < ROWS; row += 1) {
          for (let col = 0; col < COLS; col += 1) {
            const tile = document.createElement("button");
            tile.type = "button";
            tile.id = `tile-${row}-${col}`;
            tile.dataset.row = String(row);
            tile.dataset.col = String(col);
            tile.setAttribute("role", "gridcell");
            tile.setAttribute("aria-rowindex", String(row + 1));
            tile.setAttribute("aria-colindex", String(col + 1));
            tile.tabIndex = -1;
            fragment.appendChild(tile);
          }
        }
        boardElement.replaceChildren(fragment);
      }

      const cells = boardElement.children;
      for (let row = 0; row < ROWS; row += 1) {
        for (let col = 0; col < COLS; col += 1) {
          const tile = cells[row * COLS + col];
          const type = state.board[row][col];
          const key = keyOf(row, col);
          const desiredClass = `tile type-${type}`;

          if (tile.className !== desiredClass) {
            tile.className = desiredClass;
            tile.setAttribute("aria-label", `第${row + 1}行第${col + 1}列，${tileLabel(type)}`);
          }

          let cls = desiredClass;
          const isSel = currentSelected && currentSelected.row === row && currentSelected.col === col;
          if (isSel) { cls += " selected"; tile.setAttribute("aria-pressed", "true"); }
          else if (tile.hasAttribute("aria-pressed")) { tile.removeAttribute("aria-pressed"); }
          if (row === kbRow && col === kbCol) cls += " keyboard-focus";
          if (state.hint && (
            key === keyOf(state.hint.a.row, state.hint.a.col) ||
            key === keyOf(state.hint.b.row, state.hint.b.col)
          )) cls += " hint";
          if (removing.has(key)) cls += " removing";
          if (state.newTiles.has(key)) cls += " new-tile";
          if (tile.className !== cls) tile.className = cls;
        }
      }

      boardElement.setAttribute("aria-activedescendant", `tile-${kbRow}-${kbCol}`);
      state.newTiles.clear();
      updateHud();
    }

    function updateHud() {
      levelValue.textContent = String(state.level);
      scoreValue.textContent = state.score.toLocaleString("zh-CN");
      movesValue.textContent = String(state.moves);
      targetText.textContent = `${state.score.toLocaleString("zh-CN")} / ${state.target.toLocaleString("zh-CN")}`;
      const progress = Math.min(100, (state.score / state.target) * 100);
      progressFill.style.width = `${progress}%`;
      progressTrack.setAttribute("aria-valuemax", String(state.target));
      progressTrack.setAttribute("aria-valuenow", String(Math.min(state.score, state.target)));
    }

    function updateLegend(level = state.level) {
      const typeCount = typeCountForLevel(level);
      for (const item of legendItems) {
        item.hidden = Number(item.dataset.type) >= typeCount;
      }
    }

    function clearHint() {
      const hadHint = Boolean(state.hint);
      window.clearTimeout(state.hintTimer);
      state.hintTimer = null;
      state.hint = null;
      boardElement.querySelectorAll(".hint").forEach(tile => tile.classList.remove("hint"));
      if (hadHint) liveRegion.textContent = "";
    }

    function canShowHint() {
      return !state.locked &&
        modalBackdrop.hidden &&
        !state.modalMode &&
        !state.drag &&
        state.moves > 0 &&
        state.score < state.target;
    }

    function scheduleHint() {
      window.clearTimeout(state.hintTimer);
      state.hintTimer = null;
      if (state.hint || !canShowHint()) return;

      state.hintTimer = window.setTimeout(() => {
        state.hintTimer = null;
        if (state.hint || !canShowHint()) return;

        const hint = findValidMove();
        if (!hint) return;

        clearSelection();
        state.hint = hint;
        render();
        liveRegion.textContent =
          `提示：试试交换第${hint.a.row + 1}行第${hint.a.col + 1}列和第${hint.b.row + 1}行第${hint.b.col + 1}列。`;
      }, IDLE_HINT_MS);
    }

    function setStatus(message, announce = false) {
      statusText.textContent = message;
      if (announce) liveRegion.textContent = message;
    }

    function showToast(message) {
      toastElement.textContent = message;
      toastElement.classList.add("show");
      window.clearTimeout(state.toastTimer);
      state.toastTimer = window.setTimeout(() => toastElement.classList.remove("show"), 1600);
    }

    function showCombo(depth) {
      if (depth < 2) return;
      comboElement.textContent = `连击 ×${depth}`;
      comboElement.classList.remove("show");
      void comboElement.offsetWidth;
      comboElement.classList.add("show");
    }

    function clearSelection() {
      state.selected = null;
      boardElement.querySelectorAll(".selected, .drag-target").forEach(tile => {
        tile.classList.remove("selected", "drag-target");
      });
    }

    async function attemptSwap(first, second) {
      if (state.locked || !areAdjacent(first, second)) return;
      const runId = state.runId;
      clearHint();
      state.locked = true;
      clearSelection();
      swapCells(first, second);
      render();
      await wait(ANIMATION * 0.65);
      if (state.runId !== runId) return;

      let matches = findMatches();
      if (matches.size === 0) {
        swapCells(first, second);
        render();
        boardElement.classList.remove("invalid");
        void boardElement.offsetWidth;
        boardElement.classList.add("invalid");
        setStatus("这次没有连成三个，换个方向试试", true);
        await wait(ANIMATION);
        if (state.runId !== runId) return;
        boardElement.classList.remove("invalid");
        state.locked = false;
        scheduleHint();
        return;
      }

      state.moves -= 1;
      updateHud();
      setStatus("消除成功！正在计算连击…", true);
      await resolveMatches(matches, runId);
      if (state.runId !== runId) return;

      if (state.score >= state.target) {
        finishLevel(true);
        return;
      }
      if (state.moves <= 0) {
        finishLevel(false);
        return;
      }

      if (!hasValidMove()) {
        setStatus("没有可消除的组合，正在重新排列…", true);
        showToast("棋盘自动洗牌中");
        await wait(ANIMATION);
        if (state.runId !== runId) return;
        createStableBoard();
        render();
      }

      setStatus("继续拖动相邻照片，向目标分数前进吧");
      state.locked = false;
      scheduleHint();
    }

    async function resolveMatches(initialMatches, runId) {
      let matches = initialMatches;
      let cascade = 1;

      while (matches.size > 0 && state.runId === runId) {
        const gained = matches.size * 20 * cascade;
        state.score += gained;
        updateHud();
        showCombo(cascade);
        setStatus(`${cascade > 1 ? `第 ${cascade} 次连击！` : "漂亮！"} +${gained} 分`, true);

        render({ removing: matches });
        await wait(ANIMATION);
        if (state.runId !== runId) return;

        for (const key of matches) {
          const { row, col } = parseKey(key);
          state.board[row][col] = null;
        }

        applyGravityAndRefill();
        render();
        await wait(ANIMATION);
        if (state.runId !== runId) return;
        matches = findMatches();
        cascade += 1;
      }
    }

    function applyGravityAndRefill() {
      state.newTiles.clear();
      for (let col = 0; col < COLS; col += 1) {
        let writeRow = ROWS - 1;
        for (let row = ROWS - 1; row >= 0; row -= 1) {
          if (state.board[row][col] !== null) {
            state.board[writeRow][col] = state.board[row][col];
            if (writeRow !== row) state.board[row][col] = null;
            writeRow -= 1;
          }
        }
        while (writeRow >= 0) {
          state.board[writeRow][col] = randomType();
          state.newTiles.add(keyOf(writeRow, col));
          writeRow -= 1;
        }
      }
    }

    function startLevel(level = state.level) {
      clearHint();
      state.runId += 1;
      window.clearTimeout(state.toastTimer);
      state.toastTimer = null;
      toastElement.classList.remove("show");
      boardElement.classList.remove("invalid");
      const config = getLevelConfig(level);
      state.level = level;
      state.score = 0;
      state.moves = config.moves;
      state.target = config.target;
      state.locked = false;
      state.selected = null;
      state.keyboard = { row: 0, col: 0 };
      state.drag = null;
      state.newTiles.clear();
      hideModal();
      updateLegend();
      createStableBoard();
      render();
      setStatus(`第 ${level} 关：在 ${config.moves} 步内获得 ${config.target} 分`, true);
      scheduleHint();
    }

    function finishLevel(won) {
      clearHint();
      state.locked = true;
      state.modalMode = won ? "won" : "lost";

      if (won) {
        boardElement.classList.add("celebrate");
        modalIcon.textContent = "★";
        modalTitle.textContent = "闯关成功！";
        modalMessage.textContent = `你在第 ${state.level} 关留下了一次闪亮的相册连击。`;
        modalScore.textContent = `最终得分：${state.score.toLocaleString("zh-CN")} · 剩余 ${state.moves} 步`;
        modalSecondary.textContent = "重玩本关";
        modalPrimary.textContent = "下一关";
        setStatus("恭喜通关！", true);
      } else {
        modalIcon.textContent = "↻";
        modalTitle.textContent = "就差一点！";
        modalMessage.textContent = `目标是 ${state.target.toLocaleString("zh-CN")} 分，再调整一下交换顺序吧。`;
        modalScore.textContent = `本次得分：${state.score.toLocaleString("zh-CN")}`;
        modalSecondary.textContent = "回到第一关";
        modalPrimary.textContent = "再试一次";
        setStatus("步数用完了，再试一次吧", true);
      }

      modalBackdrop.hidden = false;
      const runId = state.runId;
      window.setTimeout(() => {
        if (state.runId === runId && !modalBackdrop.hidden) modalPrimary.focus();
      }, 30);
    }

    function hideModal() {
      modalBackdrop.hidden = true;
      boardElement.classList.remove("celebrate");
      state.modalMode = null;
    }

    function tilePosition(tile) {
      return { row: Number(tile.dataset.row), col: Number(tile.dataset.col) };
    }

    function selectOrSwap(position) {
      if (state.locked) return;
      if (!state.selected) {
        state.selected = position;
        render();
        setStatus("已选中一个图案，请选择相邻图案");
        scheduleHint();
        return;
      }
      if (state.selected.row === position.row && state.selected.col === position.col) {
        clearSelection();
        render();
        setStatus("已取消选择");
        scheduleHint();
        return;
      }
      if (areAdjacent(state.selected, position)) {
        const first = { ...state.selected };
        attemptSwap(first, position);
      } else {
        state.selected = position;
        render();
        setStatus("请再选择一个相邻图案");
        scheduleHint();
      }
    }

    boardElement.addEventListener("pointerdown", event => {
      if (state.locked) return;
      clearHint();
      const tile = event.target.closest(".tile");
      if (!tile) {
        scheduleHint();
        return;
      }
      const position = tilePosition(tile);
      state.drag = {
        ...position,
        startX: event.clientX,
        startY: event.clientY,
        pointerId: event.pointerId,
        target: null,
        moved: false
      };
      tile.setPointerCapture?.(event.pointerId);
      tile.classList.add("selected");
      event.preventDefault();
    });

    boardElement.addEventListener("pointermove", event => {
      if (!state.drag || state.drag.pointerId !== event.pointerId || state.locked) return;
      const dx = event.clientX - state.drag.startX;
      const dy = event.clientY - state.drag.startY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 12) return;

      state.drag.moved = true;
      let row = state.drag.row;
      let col = state.drag.col;
      if (Math.abs(dx) > Math.abs(dy)) col += dx > 0 ? 1 : -1;
      else row += dy > 0 ? 1 : -1;

      boardElement.querySelectorAll(".drag-target").forEach(tile => tile.classList.remove("drag-target"));
      if (inBounds(row, col)) {
        state.drag.target = { row, col };
        boardElement.querySelector(`[data-row="${row}"][data-col="${col}"]`)?.classList.add("drag-target");
      } else {
        state.drag.target = null;
      }
      event.preventDefault();
    });

    function finishPointer(event) {
      if (!state.drag || state.drag.pointerId !== event.pointerId) return;
      const drag = state.drag;
      state.drag = null;
      boardElement.querySelectorAll(".drag-target").forEach(tile => tile.classList.remove("drag-target"));
      if (drag.moved && drag.target) {
        attemptSwap({ row: drag.row, col: drag.col }, drag.target);
      } else {
        selectOrSwap({ row: drag.row, col: drag.col });
      }
    }

    boardElement.addEventListener("pointerup", finishPointer);
    boardElement.addEventListener("pointercancel", event => {
      if (state.drag?.pointerId === event.pointerId) {
        state.drag = null;
        render();
        scheduleHint();
      }
    });

    boardElement.addEventListener("keydown", event => {
      if (state.locked) return;
      const directions = {
        ArrowUp: [-1, 0],
        ArrowDown: [1, 0],
        ArrowLeft: [0, -1],
        ArrowRight: [0, 1]
      };

      if (directions[event.key]) {
        clearHint();
        const [rowDelta, colDelta] = directions[event.key];
        state.keyboard.row = Math.max(0, Math.min(ROWS - 1, state.keyboard.row + rowDelta));
        state.keyboard.col = Math.max(0, Math.min(COLS - 1, state.keyboard.col + colDelta));
        render();
        scheduleHint();
        event.preventDefault();
      } else if (event.key === "Enter" || event.key === " ") {
        clearHint();
        selectOrSwap({ ...state.keyboard });
        event.preventDefault();
      } else if (event.key === "Escape") {
        clearHint();
        clearSelection();
        render();
        setStatus("已取消选择");
        scheduleHint();
      }
    });

    restartButton.addEventListener("click", () => startLevel(state.level));
    newGameButton.addEventListener("click", () => {
      state.level = 1;
      saveLevel();
      startLevel(1);
    });

    modalPrimary.addEventListener("click", () => {
      if (state.modalMode === "won") {
        state.level += 1;
        saveLevel();
        startLevel(state.level);
      } else {
        startLevel(state.level);
      }
    });

    modalSecondary.addEventListener("click", () => {
      if (state.modalMode === "won") {
        startLevel(state.level);
      } else {
        state.level = 1;
        saveLevel();
        startLevel(1);
      }
    });

    modalBackdrop.addEventListener("keydown", event => {
      if (event.key !== "Tab") return;
      const buttons = [modalSecondary, modalPrimary];
      const current = buttons.indexOf(document.activeElement);
      const next = event.shiftKey ? (current - 1 + buttons.length) % buttons.length : (current + 1) % buttons.length;
      buttons[next].focus();
      event.preventDefault();
    });

    startLevel(state.level);
  </script>
</body>
</html>
